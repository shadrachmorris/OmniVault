<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14"><title>OmniVault</title>
<link rel="stylesheet" href="css/styles.css"></head><body>
<section id="publicSite" hidden>
  <header class="public-header"><a href="#welcome" class="public-brand">◆ OmniVault</a><nav aria-label="Public navigation"><a href="#welcome">Home</a><a href="#about">About</a><button id="publicLogin" class="btn ghost" type="button">Sign in</button><button id="publicRegister" class="btn primary" type="button">Get started</button></nav></header>
  <div id="publicContent"></div>
  <footer class="public-footer"><span>◆ OmniVault · Personal finance, made clearer.</span><span>Created by Shadrach Morris · <a href="#about">About & credits</a></span></footer>
</section>
<section id="auth" hidden>
  <form id="authForm" class="card auth-card" novalidate>
    <div class="logo">◆ OmniVault</div><button type="button" id="backPublic" class="btn ghost sm">← Back to website</button><h1 id="authTitle">Welcome back</h1>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <p id="authErr" class="err" role="alert"></p>
    <button class="btn primary" id="authBtn">Sign in</button>
    <button type="button" class="btn ghost" id="authSwitch">Create an account</button>
  </form>
</section>
<div id="shell" hidden>
  <aside id="nav"></aside>
  <main><header class="top"><h2 id="pageTitle"></h2><div><button class="btn ghost" id="refresh">↻ Refresh</button><button class="btn ghost" id="logout">Sign out</button></div></header>
  <div id="view" aria-live="polite"></div></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script></body></html>
