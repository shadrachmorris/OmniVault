# Render Blueprint Configuration for Microservices Architecture
# File: render.yaml
# Reference Name: Draft2Code Setup

services:
  # 1. Managed PostgreSQL Database Instance
  - type: database
    name: postgres-db
    plan: free
    databaseName: micro_db
    user: micro_user

  # 2. Authentication Microservice (Private Service)
  - type: pservice
    name: auth-service
    env: docker
    plan: free
    dockerfilePath: auth_service/Dockerfile
    dockerContext: auth_service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

  # 3. Data Processing Engine (Private Service)
  - type: pservice
    name: processing-engine
    env: docker
    plan: free
    dockerfilePath: data_processing_engine/Dockerfile
    dockerContext: data_processing_engine
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://auth-service:8000

  # 4. API Gateway (Public-Facing Web Service)
  - type: web
    name: api-gateway
    env: docker
    plan: free
    dockerfilePath: gateway/Dockerfile
    dockerContext: gateway
    port: 8000
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://auth-service:8000
      - key: PROCESSING_ENGINE_URL
        value: http://processing-engine:8000
