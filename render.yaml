services:
  - type: web
    name: draft2code-backend
    env: python
    region: ohio
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: web
    name: draft2code-frontend
    region: ohio
    env: static
    staticPublishPath: ./frontend
